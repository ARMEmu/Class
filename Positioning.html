<html>
    <head>
        <title>
            Positioning
        </title>
        <style>
       div {
            right: 30px;
            border: 3px solid #73ad21

       }

       div.absolute {
           position: absolute;
           left: 50px;
           border: 3px solid blue;

       }

       div.relative {
        position: relative;
        left: 100px;
        border: 3px solid #73AD21;

       }

       div.fixed {
        position: fixed;
        top: 0;
        right: 20px;
        width: 300px;
        border:3px solid #73AD21;

       }

       div.sticky {
        position: sticky;
        top: 1px;
        left: 20px;
        width: 100px;
        border: 3px solid #73AD21;

       }
       </style>
    </head>
    <body>
        <h2> Positioning </h2>
        <div>
            div with no position property
        </div>
        <div class="sticky">
         div with Sticky Position Property
        </div>
        <div class="fixed">
            div with Fixed Position Property
        </div>
        <div class="relative">
            this element has position:relative;
            <div class="absolute">
             absolute Class Division
             </div>
 
        </div>
    </body>
</html>
