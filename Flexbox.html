<html>
    <head>
        <title>
            Flexbox
        </title>
        <style>
            .flex-container{
                display:flex;
                width:300px;
                background-color: blue;
                padding: 20px;
                justify-content: center;
                flex-direction: row;
                align-items: flex-end;
            }
            .flex-container div{
                width: 100px;
                background-color: burlywood;
                margin: 5px;
                padding: 5px;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
            }
        </style>
    </head>
    <body>
        <div class="flex-container">
            <div> Simple Text </div>
            <div> Simple Text </div>
            <div> Simple Test </div>
        </div>
    </body>
</html>
